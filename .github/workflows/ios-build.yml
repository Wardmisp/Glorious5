name: iOS build check

# Validates that :shared actually links into an iOS framework. Apple's toolchain (used for the
# native link step) only runs on macOS, which is why this needs a macos runner instead of the
# usual Linux/Windows ones -- see :shared's Kotlin source, which already cross-compiles fine
# elsewhere; only linking needs a real Mac.
on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

jobs:
  build-ios-framework:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build shared framework for iOS Simulator (arm64)
        # --configure-on-demand keeps Gradle from configuring :app (and its Google Services
        # plugin, which needs a google-services.json this runner doesn't have) since this task
        # only needs :shared.
        #
        # DEVELOPER_DIR pins Xcode 16.1 instead of this runner's default (15.4): Supabase Auth's
        # CryptoKit interop needs Swift stdlib symbols (swift_Builtin_float) that 15.4's bundled
        # Swift toolchain doesn't have.
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.1.app/Contents/Developer
        run: ./gradlew --configure-on-demand :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate iosApp.xcodeproj
        working-directory: iosApp
        run: xcodegen generate

      - name: Build and test the iOS app shell (Simulator)
        working-directory: iosApp
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.1.app/Contents/Developer
        # The project's Run Script build phase calls `./gradlew :shared:embedAndSignAppleFrameworkForXcode`
        # itself, so this alone builds and embeds the Kotlin framework too.
        # A concrete simulator (rather than the generic destination) resolves to this runner's
        # native arm64 slice only -- the generic one requests x86_64 too, which :shared doesn't
        # declare a Kotlin/Native target for.
        # `test` (not `build`) actually boots the simulator and runs iosAppTests, which calls
        # into Kotlin from Swift (Platform_iosKt.platformName()) -- not just that the framework
        # links. -derivedDataPath pins where the built .app ends up so the screenshot step below
        # can find it without a second, redundant build.
        run: |
          xcodebuild -project iosApp.xcodeproj -scheme iosApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' \
            -derivedDataPath build \
            test

      - name: Boot simulator, launch the app, capture a screenshot
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.1.app/Contents/Developer
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '.devices["com.apple.CoreSimulator.SimRuntime.iOS-18-2"][] | select(.name=="iPhone 16") | .udid')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID"
          xcrun simctl install "$UDID" iosApp/build/Build/Products/Debug-iphonesimulator/iosApp.app
          xcrun simctl launch "$UDID" com.g5.iosApp
          sleep 3
          xcrun simctl io "$UDID" screenshot ios-screenshot.png
          xcrun simctl shutdown "$UDID" || true

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshot
          path: ios-screenshot.png
